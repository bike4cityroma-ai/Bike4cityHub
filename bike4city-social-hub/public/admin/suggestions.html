<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bike4City • Admin • Proposte</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <a href="/index.html" class="logoText">Bike4City</a>
        <span class="area-badge area-admin">ADMIN</span>
      </div>
      <nav class="nav">
        <a href="/admin/index.html">Dashboard</a>
        <a href="/admin/routes.html">Archivio Tracce</a>
        <a href="/admin/suggestions.html" class="active">Proposte</a>
        <a href="#" id="logoutBtn">Esci</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-left">
        <h1 class="hero-title">Proposte Soci</h1>
        <p class="hero-sub">
          <span class="muted" id="whoami">…</span>
        </p>
      </div>
      <div class="hero-actions">
        <button class="chip chip-ghost" id="btnReload" type="button">↻ Ricarica</button>
      </div>
    </section>

    <main class="grid" style="grid-template-columns: 1fr;">
      <section class="panel">
        <div class="panel-head" style="align-items:center; gap:10px; flex-wrap:wrap;">
          <h2 style="margin-right:auto;">In arrivo</h2>

          <input id="q" class="input" placeholder="Cerca titolo…" style="min-width:220px;">
          <span class="tag">Totale: <strong id="count">0</strong></span>
        </div>

        <div id="list" class="list">Caricamento…</div>
      </section>
    </main>

    <footer>Bike4City ©</footer>
  </div>

  <script type="module" src="/js/suggestions-admin.js"></script>
</body>
</html>
