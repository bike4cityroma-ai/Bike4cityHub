<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bike4City – Admin • Archivio Tracce</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <a href="/index.html" class="logoText">Bike4City</a>
        <span class="area-badge area-admin">ADMIN</span>
      </div>

      <nav class="nav">
        <a href="/admin/index.html">Dashboard</a>
        <a href="/admin/posts.html">Messaggi</a>
        <a href="/admin/hub-percorsi.html">Planner</a>
        <a href="/admin/routes.html" class="active">Archivio Tracce</a>
        <a href="#" id="logoutBtn">Esci</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-left">
        <h1 class="hero-title">Archivio Tracce</h1>
        <p class="hero-sub">
          Qui trovi i percorsi salvati in <code>routes_admin</code>.
          Puoi duplicare, eliminare e copiare il GPX.
          <span class="muted" id="whoami" style="display:block; margin-top:6px;"></span>
        </p>
      </div>

      <div class="hero-actions">
        <a class="chip chip-primary" href="/admin/hub-percorsi.html">➕ Nuova traccia</a>
        <button class="chip chip-ghost" id="btnReload" type="button">🔄 Aggiorna</button>
      </div>
    </section>

    <main class="grid" style="grid-template-columns:1fr;">
      <section class="panel">
        <div class="panel-head" style="align-items:center; gap:10px; flex-wrap:wrap;">
          <h2 style="margin-right:auto;">Percorsi (Admin)</h2>
          <input id="q" class="input" placeholder="Cerca titolo…" style="max-width:280px;" />
          <span class="pill" id="count">…</span>
        </div>

        <div id="list" class="list muted">Caricamento…</div>
      </section>
    </main>

    <footer>Bike4City © – mobilità sostenibile, territorio, comunità</footer>
  </div>

  <script type="module" src="/js/routes-admin.js"></script>
</body>
</html>
