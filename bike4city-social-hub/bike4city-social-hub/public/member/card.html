<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Area Soci – Tessera</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .wrap{ max-width: 920px; margin: 0 auto; padding: 16px; }
    .card-preview{ position:relative; border-radius:18px; overflow:hidden; min-height:190px; border:1px solid rgba(0,0,0,.1); box-shadow:0 10px 30px rgba(0,0,0,.18); background:#111; }
    .card-bg{ position:absolute; inset:0; background-image:url('/img/card-bg.jpg'); background-size:cover; background-position:center; transform:scale(1.03); filter:brightness(1.12) contrast(1.05) saturate(1.05); }
    .card-glass{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.40), rgba(0,0,0,.12)); }
    .card-content{ position:relative; padding:14px; color:#fff; }
    .card-top{ display:flex; justify-content:space-between; gap:10px; align-items:start; }
    .title{ font-size:20px; font-weight:900; text-shadow:0 1px 10px rgba(0,0,0,.5); }
    .sub{ margin-top:4px; font-size:12px; opacity:.96; text-shadow:0 1px 10px rgba(0,0,0,.45); word-break:break-word; }
    .pill{ padding:5px 10px; border-radius:999px; font-size:12px; font-weight:900; color:#fff; box-shadow:0 8px 18px rgba(0,0,0,.25); display:inline-block; }
    .st-pending{ background:#ff9800; } .st-active{ background:#2e7d32; } .st-expired{ background:#c62828; }
    .bottom{ margin-top:14px; display:flex; justify-content:space-between; align-items:end; gap:10px; }
    .kv b{ display:block; font-size:11px; opacity:.85; }
    .qr{ width:86px; height:86px; border-radius:14px; background:rgba(255,255,255,.93); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 20px rgba(0,0,0,.28); }
    table{ width:100%; border-collapse:collapse; margin-top:14px; }
    th,td{ padding:8px 6px; border-bottom:1px solid rgba(0,0,0,.08); text-align:left; }
    .muted{ opacity:.75; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <a href="/index.html" class="logoText">Bike4City</a>
        <span class="area-badge area-socio">SOCIO</span>
      </div>
      <nav class="nav">
        <a href="/member/card.html">Tessera</a>
        <a href="#" id="logoutBtn">Esci</a>
      </nav>
    </header>

    <h1 style="margin-top:14px;">La tua tessera digitale</h1>
    <div class="card-preview">
      <div class="card-bg"></div>
      <div class="card-glass"></div>
      <div class="card-content">
        <div class="card-top">
          <div>
            <div class="title" id="mName">—</div>
            <div class="sub" id="mEmail">—</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px; align-items:flex-end;">
            <div id="mStatus"></div>
            <div class="qr"><canvas id="qrCanvas"></canvas></div>
          </div>
        </div>

        <div class="bottom">
          <div class="kv">
            <b>Tessera</b>
            <div id="mNumber">—</div>
          </div>
          <div class="kv" style="text-align:right;">
            <b>Validità</b>
            <div id="mValid">—</div>
          </div>
        </div>
      </div>
    </div>

    <h2 style="margin-top:18px;">Pagamenti</h2>
    <div class="muted" id="payHint">Caricamento…</div>
    <div style="overflow:auto;">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Importo</th>
            <th>Metodo</th>
            <th>Validità</th>
            <th>Ricevuta</th>
          </tr>
        </thead>
        <tbody id="payTbody">
          <tr><td colspan="5" class="muted">—</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/js/member-card.js"></script>
</body>
</html>
